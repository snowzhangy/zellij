name: ZellijAgent
options:
  bundleIdPrefix: dev.zellij
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.13.0
targets:
  ZellijAgent:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - ZellijAgent/Sources
    dependencies:
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cinetec.dev.zellij.agentios
        INFOPLIST_FILE: ZellijAgent/Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: E3LHDHQKAV
  ZellijAgentTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - ZellijAgentTests
    dependencies:
      - package: SwiftTerm
      - target: ZellijAgent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zellij.agentios.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: E3LHDHQKAV
